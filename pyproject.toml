[project]
name = "chao"
version = "0.1.0"
description = "Headless LLM-driven companion character rendered through VTube Studio."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chao"]

[tool.ruff]
line-length = 100
target-version = "py311"
