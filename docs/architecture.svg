<svg width="100%" viewBox="0 0 680 576" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chao companion system architecture</title>
<desc>Inputs feed an event bus and turn arbiter, which drives a brain layer of memory, language model and personality state, then a director that converts output into voice, VTube Studio emotes and motion, and a debug dashboard.</desc>
<style>
  .t  { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 400; }
  .ts { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 400; }
  .th { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500; }
  .in  rect { fill: #E1F5EE; stroke: #0F6E56; }
  .in  .th   { fill: #085041; }
  .in  .ts   { fill: #0F6E56; }
  .mid rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .mid .th   { fill: #444441; }
  .mid .ts   { fill: #5F5E5A; }
  .br  rect { fill: #EEEDFE; stroke: #534AB7; }
  .br  .th   { fill: #3C3489; }
  .br  .ts   { fill: #534AB7; }
  .out rect { fill: #FAECE7; stroke: #993C1D; }
  .out .th   { fill: #712B13; }
  .out .ts   { fill: #993C1D; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .in  rect { fill: #085041; stroke: #5DCAA5; }
    .in  .th  { fill: #9FE1CB; } .in  .ts { fill: #5DCAA5; }
    .mid rect { fill: #444441; stroke: #B4B2A9; }
    .mid .th  { fill: #D3D1C7; } .mid .ts { fill: #B4B2A9; }
    .br  rect { fill: #3C3489; stroke: #AFA9EC; }
    .br  .th  { fill: #CECBF6; } .br  .ts { fill: #AFA9EC; }
    .out rect { fill: #712B13; stroke: #F0997B; }
    .out .th  { fill: #F5C4B3; } .out .ts { fill: #F0997B; }
    .arr { stroke: #888780; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="in">
<rect x="60" y="40" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="58" text-anchor="middle" dominant-baseline="central">Twitch chat</text>
<text class="ts" x="140" y="78" text-anchor="middle" dominant-baseline="central">IRC websocket</text>
<rect x="260" y="40" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Your voice</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">VAD + whisper</text>
<rect x="460" y="40" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="58" text-anchor="middle" dominant-baseline="central">Ambient events</text>
<text class="ts" x="540" y="78" text-anchor="middle" dominant-baseline="central">idle, timers, alerts</text>
</g>

<line x1="140" y1="96" x2="140" y2="142" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="142" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="96" x2="540" y2="142" class="arr" marker-end="url(#arrow)"/>

<g class="mid">
<rect x="60" y="150" width="560" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="168" text-anchor="middle" dominant-baseline="central">Event bus and turn arbiter</text>
<text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">async, prioritised, fully cancellable</text>
</g>

<line x1="140" y1="206" x2="140" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="206" x2="340" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="206" x2="540" y2="252" class="arr" marker-end="url(#arrow)"/>

<g class="br">
<rect x="60" y="260" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="278" text-anchor="middle" dominant-baseline="central">Memory</text>
<text class="ts" x="140" y="298" text-anchor="middle" dominant-baseline="central">SQLite + vectors</text>
<rect x="260" y="260" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="278" text-anchor="middle" dominant-baseline="central">Language model</text>
<text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central">local CPU or cloud</text>
<rect x="460" y="260" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="278" text-anchor="middle" dominant-baseline="central">Personality state</text>
<text class="ts" x="540" y="298" text-anchor="middle" dominant-baseline="central">traits + affinity</text>
</g>

<line x1="140" y1="316" x2="140" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="316" x2="340" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="316" x2="540" y2="362" class="arr" marker-end="url(#arrow)"/>

<g class="mid">
<rect x="60" y="370" width="560" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="388" text-anchor="middle" dominant-baseline="central">Director and aliveness layer</text>
<text class="ts" x="340" y="408" text-anchor="middle" dominant-baseline="central">strips tags, schedules emotes, drives idle motion</text>
</g>

<line x1="140" y1="426" x2="140" y2="472" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="426" x2="340" y2="472" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="426" x2="540" y2="472" class="arr" marker-end="url(#arrow)"/>

<g class="out">
<rect x="60" y="480" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="498" text-anchor="middle" dominant-baseline="central">Voice out</text>
<text class="ts" x="140" y="518" text-anchor="middle" dominant-baseline="central">TTS to virtual cable</text>
<rect x="260" y="480" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="498" text-anchor="middle" dominant-baseline="central">VTube Studio</text>
<text class="ts" x="340" y="518" text-anchor="middle" dominant-baseline="central">hotkeys + parameters</text>
<rect x="460" y="480" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="498" text-anchor="middle" dominant-baseline="central">Debug UI</text>
<text class="ts" x="540" y="518" text-anchor="middle" dominant-baseline="central">browser dashboard</text>
</g>
</svg>
