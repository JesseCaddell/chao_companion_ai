# Emote pools, hotkey selection, and reaction mapping. See design doc §14.
#
# `hotkeys` values are the real expression FILE names, e.g. "happy_eyes
# .exp3.json", not arbitrary hotkey labels. CLAUDE.md's phase-0 finding is
# that emotes fire via ExpressionActivationRequest (explicit active:
# true/false), not HotkeyTriggerRequest — a hotkey with the same name
# exists 1:1 per expression but outputs/vts.py should call the expression
# file directly, not trigger the hotkey.
#
# Session 10 part 14: pools split into genuinely eyes-only or ball-only
# expression files (docs/chao_expressions.md — user-authored, VTS-side
# work), matching design doc's Expression model for real instead of one
# bundled file per pool. `channel: eyes` (sustained mood) or `channel:
# ball` (beat-level cognition) — outputs/vts.py's VTSEmoteSubscriber
# enforces mutual exclusion *within* a channel, not across channels, so
# eyes and ball can run simultaneously now. Filenames below assume
# `<name>.exp3.json` matching docs/chao_expressions.md's naming exactly —
# not yet live-verified against the actual renamed VTS files.
#
# `neutral` has NO matching expression in VTS yet — confirmed missing,
# not just unverified. Nothing currently fires it (no tag maps to
# "neutral" in director.py's _TAG_TO_POOL), so leaving hotkeys empty is
# safe for now. Once a default-state expression is authored in VTS, fill
# in its file name here.
#
# director.py reads `pools`. `mood` is read by mood.py's load_mood_config.
# `fly` is read by aliveness.py's load_fly_config (session 9 -- the §6.4
# state machine plus horizontal screen positioning). `heart_gate` still
# belongs to mood.py (affinity-gated per §6.3, needs memory -- phase 6) and
# isn't built yet. `reactions` maps a non-verbal-only trigger (§10.4) to a
# pool; aliveness.py's Aliveness.handle reads `reactions.anticipation` to
# drive the §10.5 anticipation nudge (question mark on brain.request,
# before any audio exists) and `reactions.chat_spike` (session 10 part 10)
# — the only two reactions wired up so far. The rest of this block is
# still aspirational.

pools:
  happy_eyes:    { hotkeys: [happy_eyes.exp3.json], cooldown_s: 4, duration_s: 2.5, channel: eyes }
  sad_eyes:      { hotkeys: [sad_eyes.exp3.json], cooldown_s: 10, duration_s: 4.0, channel: eyes }
  angry_eyes:    { hotkeys: [angry_eyes.exp3.json], cooldown_s: 15, duration_s: 3.0, channel: eyes }
  confused_eyes: { hotkeys: [confused_eyes.exp3.json], cooldown_s: 8, duration_s: 3.0, channel: eyes }
  question_bub:  { hotkeys: [question_bub.exp3.json], cooldown_s: 3, duration_s: 2.0, channel: ball }
  surprise_bub:  { hotkeys: [surprise_bub.exp3.json], cooldown_s: 6, duration_s: 1.5, channel: ball }
  confused_bub:  { hotkeys: [confused_bub.exp3.json], cooldown_s: 8, duration_s: 3.0, channel: ball }
  heart_bub:     { hotkeys: [heart_bub.exp3.json], cooldown_s: 12, duration_s: 3.0, channel: ball }
  neutral:       { hotkeys: [], cooldown_s: 0, duration_s: 0, channel: eyes }  # pending: no VTS expression yet

fly:
  hotkey: fly.exp3.json
  on_above: 0.70
  off_below: 0.40
  min_dwell_s: 5
  x_range: [-0.6, 0.6]      # MoveModelRequest positionX bounds (§6.4 horizontal
                             # flying). Eyeballed live against the real OBS-capture
                             # framing (session 10): started at the session-9
                             # placeholder [-0.4, 0.4] (~2in of margin on each side,
                             # comfortable), then confirmed [-0.6, 0.6] stays fully
                             # on screen with a perfect glide both ways -- locked in
                             # at 0.6, not pushed further since it wasn't tested.
  move_duration_s: 2.0      # timeInSeconds per MoveModelRequest while repositioning
  land_duration_s: 1.5      # shorter glide back to resting X when landing
  min_reposition_s: 8.0     # minimum gap between horizontal repositions while flying

  # Session 11: "adventurous or bored or any feeling" redesign -- flying is
  # no longer a guaranteed consequence of crossing on_above. See
  # aliveness.py's Fly docstring for the full reasoning; tuning placeholders
  # below, not yet live-verified by ear.
  launch_probability: 0.35   # chance to actually launch on crossing on_above (edge-triggered,
                              # one roll per crossing -- see Fly docstring). 1.0 = old always-
                              # launch behavior; this is what makes flying occasional again.
  boredom_below: 0.35        # a second, independent launch path -- arousal sitting near/at
  boredom_dwell_s: 45.0      # baseline (not agitated, not sad) for this long makes the chao
  boredom_probability: 0.05  # eligible, then this rolls on every mood tick while eligible
                              # (~1Hz per mood.py's tick_interval_s) -- expected ~20s after
                              # eligibility, so roughly a minute of genuine calm before takeoff.
                              # MUST stay above mood.baseline_arousal (0.3 below) -- decay only
                              # moves arousal TOWARD baseline, never past it during genuine calm,
                              # so a boredom_below at or under baseline is unreachable except in
                              # the brief post-[sad]-tag decay window, which §6.4's hard landing
                              # rule already owns. advisor caught this before it shipped wrong.

heart_gate:
  affinity_threshold: 0.4
  valence_threshold: 0.5

mood:                    # §6, §10 -- mood.py's valence/arousal resting point + decay rate.
  baseline_valence: 0.2    # tuning placeholder: generally cheerful resting point, not yet
  baseline_arousal: 0.3    # reflection-driven (§7's long-term baseline drift is phase 7).
                            # NOTE: this arousal value is what `fly`'s hysteresis above (on
                            # >0.70) decays back toward once aliveness.py reads it -- raising
                            # it means more time spent flying at rest, not just during spikes.
  half_life_s: 20.0        # seconds for a mood nudge to decay halfway back to baseline
  tick_interval_s: 1.0     # session 9's minimal timescale loop -- __main__.py's _run_mood
                            # calls Mood.tick() on this timeout when no event arrives, so
                            # decay progresses and Fly can land during a quiet stretch.

reactions:                 # non-verbal only, no LLM call
  anticipation:   question_bub   # §10.5 — wired up, see aliveness.py
  chat_spike:     surprise_bub   # session 10 part 10 — wired up, see aliveness.py
  name_mention:   question_bub
  new_follower:   happy_eyes
  long_silence:   sad_eyes
  streamer_laugh: happy_eyes
  thinking:       question_bub
