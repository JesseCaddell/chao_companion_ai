# Emote pools, hotkey selection, and reaction mapping. See design doc §14.
#
# `hotkeys` values are confirmed live against this model's VTS instance
# (queried via ExpressionStateRequest/HotkeysInCurrentModelRequest,
# 2026-08-07) — they're the real expression FILE names, e.g.
# "happy.exp3.json", not arbitrary hotkey labels. CLAUDE.md's phase-0
# finding is that emotes fire via ExpressionActivationRequest (explicit
# active: true/false), not HotkeyTriggerRequest — a hotkey with the same
# name exists 1:1 per expression but outputs/vts.py should call the
# expression file directly, not trigger the hotkey.
#
# `neutral` has NO matching expression in VTS yet — confirmed missing,
# not just unverified. Nothing currently fires it (no tag maps to
# "neutral" in director.py's _TAG_TO_POOL), so leaving hotkeys empty is
# safe for now. Once a default-state expression is authored in VTS, fill
# in its file name here.
#
# director.py reads `pools`. `mood` is read by mood.py's load_mood_config.
# `fly` is read by aliveness.py's load_fly_config (session 9 -- the §6.4
# state machine plus horizontal screen positioning). `heart_gate` still
# belongs to mood.py (affinity-gated per §6.3, needs memory -- phase 6) and
# isn't built yet. `reactions` maps a non-verbal-only trigger (§10.4) to a
# pool; aliveness.py's Aliveness.handle reads `reactions.anticipation` to
# drive the §10.5 anticipation nudge (question mark on brain.request,
# before any audio exists) — the only reaction wired up so far. The rest of
# this block is still aspirational.

pools:
  happy:      { hotkeys: [happy.exp3.json], cooldown_s: 4, duration_s: 2.5 }
  heart:      { hotkeys: [heart.exp3.json], cooldown_s: 12, duration_s: 3.0 }
  curious:    { hotkeys: [question.exp3.json], cooldown_s: 3, duration_s: 2.0 }
  surprise:   { hotkeys: [surprise.exp3.json], cooldown_s: 6, duration_s: 1.5 }
  confused:   { hotkeys: [confused.exp3.json], cooldown_s: 8, duration_s: 3.0 }
  sad:        { hotkeys: [sad.exp3.json], cooldown_s: 10, duration_s: 4.0 }
  angry:      { hotkeys: [angry.exp3.json], cooldown_s: 15, duration_s: 3.0 }
  neutral:    { hotkeys: [], cooldown_s: 0, duration_s: 0 }  # pending: no VTS expression yet

fly:
  hotkey: fly.exp3.json
  on_above: 0.70
  off_below: 0.40
  min_dwell_s: 5
  x_range: [-0.4, 0.4]      # MoveModelRequest positionX bounds (§6.4 horizontal
                             # flying, session 9). -0.4 confirmed reachable live via
                             # a MoveModelRequest probe -- it genuinely interpolates
                             # (not a snap), positionX went baseline ~-0.03 -> -0.4
                             # smoothly over the requested timeInSeconds. Exact
                             # visible window edges NOT yet confirmed by eye --
                             # this range is a conservative placeholder pending
                             # that visual check. Tune once confirmed.
  move_duration_s: 2.0      # timeInSeconds per MoveModelRequest while repositioning
  land_duration_s: 1.5      # shorter glide back to resting X when landing
  min_reposition_s: 8.0     # minimum gap between horizontal repositions while flying

heart_gate:
  affinity_threshold: 0.4
  valence_threshold: 0.5

mood:                    # §6, §10 -- mood.py's valence/arousal resting point + decay rate.
  baseline_valence: 0.2    # tuning placeholder: generally cheerful resting point, not yet
  baseline_arousal: 0.3    # reflection-driven (§7's long-term baseline drift is phase 7).
                            # NOTE: this arousal value is what `fly`'s hysteresis above (on
                            # >0.70) decays back toward once aliveness.py reads it -- raising
                            # it means more time spent flying at rest, not just during spikes.
  half_life_s: 20.0        # seconds for a mood nudge to decay halfway back to baseline
  tick_interval_s: 1.0     # session 9's minimal timescale loop -- __main__.py's _run_mood
                            # calls Mood.tick() on this timeout when no event arrives, so
                            # decay progresses and Fly can land during a quiet stretch.

reactions:            # non-verbal only, no LLM call
  anticipation:   curious   # §10.5 — wired up, see aliveness.py
  chat_spike:     surprise
  name_mention:   curious
  new_follower:   happy
  long_silence:   sad
  streamer_laugh: happy
  thinking:       curious
